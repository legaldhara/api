services:
  postgres:
    image: postgres:15
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legaldhara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-LegalDhara}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "5432:5432"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      - postgres
    # ports:
    #   - "3000:3000"
    restart: unless-stopped
    networks:
      - backend
      - frontend
    volumes:
      - /etc/secrets:/etc/secrets:ro

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - server
    networks:
      - frontend
      - backend
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/html/.well-known:/usr/share/nginx/html/.well-known
      # - ./nginx/html:/usr/share/nginx/html # I Uncomment this to allow certbot to write the challenge files for domain validation

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/html:/usr/share/nginx/html
    entrypoint: >
      sh -c "certbot certonly --webroot -w /usr/share/nginx/html \
      -m vibrantlawassociates@gmail.com --agree-tos --no-eff-email \
      -d legaldhara.in -d www.legaldhara.in -d legaldhara.com -d www.legaldhara.com"

  certbot-renew:
    image: certbot/certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - ./nginx/html:/usr/share/nginx/html
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: >
      sh -c "
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /usr/share/nginx/html &&
        docker exec nginx nginx -s reload;
        sleep 12h & wait $${!};
      done"
    restart: unless-stopped

volumes:
  pgdata:

networks:
  frontend:
  backend:
