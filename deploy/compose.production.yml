name: ${COMPOSE_PROJECT_NAME:-legaldhara}

x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    env_file: ${ENV_FILE:-.env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *bounded-logs

  migrate:
    build:
      context: ../server
      target: migration
    env_file: ${ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"

  api:
    image: legaldhara-api:${IMAGE_TAG:-local}
    build:
      context: ../server
      target: runtime
    env_file: ${ENV_FILE:-.env.production}
    expose:
      - "4001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *bounded-logs

  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.legaldhara.com}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *bounded-logs

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  caddy_logs:
