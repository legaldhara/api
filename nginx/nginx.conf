worker_processes 1;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ------------------------------
    # Redirect HTTP -> HTTPS for all domains
    # ------------------------------
    server {
        listen 80;
        # server_name legaldhara.com www.legaldhara.com legaldhara.in www.legaldhara.in;
        server_name legaldhara.com www.legaldhara.com legaldhara.in www.legaldhara.in;

        location ^~ /.well-known/acme-challenge/ {
            root /usr/share/nginx/html;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============================================================
    # FIRST: HTTPS for .COM
    # ============================================================
    server {
        listen 443 ssl http2;
        server_name legaldhara.com www.legaldhara.com;

        ssl_certificate     /etc/letsencrypt/live/legaldhara.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/legaldhara.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html/website;
        index index.html;

        location / {
            try_files $uri $uri/ $uri.html /index.html;
        }

        location ^~ /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        location = /admin {
            return 301 /admin/;
        }

        # -------------------------
        # API Proxy
        # -------------------------
        location /api/ {
            proxy_pass http://server:3000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---------------------------------------------------
        # SOCKET.IO — FULL WORKING CONFIG FOR .COM DOMAIN
        # ---------------------------------------------------
        location /socket.io/ {
            proxy_pass http://server:3000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # Firebase SW
        location = /firebase-messaging-sw.js {
            alias /usr/share/nginx/html/admin/firebase-messaging-sw.js;
            default_type application/javascript;
        }

        location = /admin/firebase-messaging-sw.js {
            alias /usr/share/nginx/html/admin/firebase-messaging-sw.js;
            default_type application/javascript;
        }

        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
            try_files $uri =404;
            expires 6M;
            access_log off;
            add_header Cache-Control "public, immutable";
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript;
    }

    # ============================================================
    # SECOND: HTTPS for .IN
    # ============================================================
    server {
        listen 443 ssl http2;
        server_name legaldhara.in www.legaldhara.in;

        ssl_certificate     /etc/letsencrypt/live/legaldhara.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/legaldhara.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root /usr/share/nginx/html/website;
        index index.html;

        location / {
            try_files $uri $uri/ $uri.html /index.html;
        }

        location ^~ /admin/ {
            alias /usr/share/nginx/html/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        location = /admin {
            return 301 /admin/;
        }

        # API
        location /api/ {
            proxy_pass http://server:3000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---------------------------------------------------
        # SOCKET.IO — FULL WORKING CONFIG FOR .IN DOMAIN
        # ---------------------------------------------------
        location /socket.io/ {
            proxy_pass http://server:3000;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        # Firebase SW
        location = /firebase-messaging-sw.js {
            alias /usr/share/nginx/html/admin/firebase-messaging-sw.js;
            default_type application/javascript;
        }

        location = /admin/firebase-messaging-sw.js {
            alias /usr/share/nginx/html/admin/firebase-messaging-sw.js;
            default_type application/javascript;
        }

        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
            try_files $uri =404;
            expires 6M;
            access_log off;
            add_header Cache-Control "public, immutable";
        }

        gzip on;
        gzip_types text/plain text/css application/json application/javascript;
    }
}
